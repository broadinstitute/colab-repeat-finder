name: unit tests

on:
  # Deliberately not triggered on tags. A tag run checks out the tagged commit AND the workflow file as
  # it existed there, so tagging a historical commit re-runs that commit's old CI config against today's
  # runners. Nothing depends on tag runs: build_docker_image.yml gates on head_branch == 'main'.
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
        # Python 3.9 is tested on a pinned ubuntu-24.04 runner only, because actions/setup-python has no
        # 3.9 build for Ubuntu 26.04 (what ubuntu-latest now points to) or for darwin-arm64
        # (macos-latest). Keep this leg: the docker image runs on python:3.9-slim.
        include:
          - os: ubuntu-24.04
            python-version: '3.9'
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -p "*tests.py"
