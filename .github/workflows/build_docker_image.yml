name: build docker image

# Rebuilds the colab-repeat-finder docker image and pushes it to Docker Hub. After the push, the
# updated hail_batch_pipeline/docker/sha256.txt digest and the DOCKER_IMAGE constant in
# hail_batch_pipeline/run_hail_batch_pipeline.py are committed back to the repo, so the pipeline always
# runs the image built from current source instead of drifting behind it.
#
# This workflow does NOT run directly on push. Instead it runs after the "unit tests" workflow
# completes, and only proceeds when that run (a) succeeded, (b) was triggered by a push to main, and
# (c) touched the code baked into the image (checked by the guard job below). This guarantees the image
# is only published from a commit whose tests passed. It can also be triggered manually
# (Actions tab -> "build docker image" -> "Run workflow"), which bypasses the test gate.
#
# The digest commit uses [skip ci] so it does not re-run the tests and therefore does not re-trigger
# this workflow.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME - Docker Hub account name
#   DOCKERHUB_TOKEN    - Docker Hub access token with read/write scope

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["unit tests"]
    types:
      - completed

permissions:
  contents: write

jobs:
  guard:
    name: gate on tests + changed paths
    runs-on: ubuntu-latest
    # Run only for a manual dispatch, or a successful "unit tests" run that was triggered by a push to
    # main. Test runs from pull requests or failed test runs do not match, so the build is skipped.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    outputs:
      run: ${{ steps.decide.outputs.run }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Decide whether to build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A manual dispatch always builds (no path filtering).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger: building."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Otherwise build only when image-relevant files changed since the last image publish.
          # The range must cover the WHOLE push, not just its final commit: a push can contain several
          # commits, and diffing ${head}^..${head} judges all of them by the last one. A push whose tip
          # commit happens to be unrelated (docs, a README tweak) would then skip the build even though an
          # earlier commit in the same push changed perfect_repeat_finder.py, leaving the published image
          # stale until some later push happened to end in a relevant commit. So walk back to the commit
          # the last successful run of this workflow built, and diff from there.
          head='${{ github.event.workflow_run.head_sha }}'
          prev=$(gh api --paginate \
                   "repos/${GITHUB_REPOSITORY}/actions/workflows/build_docker_image.yml/runs?status=success&branch=main&per_page=20" \
                   --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | .head_sha] | first' 2>/dev/null | head -n 1 || true)
          if [ -n "${prev:-}" ] && [ "$prev" != "null" ] && git cat-file -e "${prev}^{commit}" 2>/dev/null \
              && [ "$prev" != "$head" ] && git merge-base --is-ancestor "$prev" "$head" 2>/dev/null; then
            base="$prev"
            echo "Base = commit built by the last successful run ($base)."
          elif git rev-parse "${head}^" >/dev/null 2>&1; then
            base="${head}^"
            echo "No usable previous successful run; falling back to $base."
          else
            base=$(git rev-list --max-parents=0 "$head" | tail -n 1)
            echo "No parent commit; falling back to the root commit $base."
          fi
          echo "Comparing ${base}..${head}"
          # This workflow's own digest commits touch sha256.txt. Widening the range above would otherwise
          # match it every time and make the path filter always true.
          files=$(git diff --name-only "$base" "$head" | grep -v '^hail_batch_pipeline/docker/sha256\.txt$' || true)
          echo "Changed files (excluding the published digest file):"
          echo "$files"
          # These are exactly the paths the Dockerfile bakes into the image, plus this workflow itself.
          if echo "$files" | grep -Eq '^(perfect_repeat_finder\.py|utils/|requirements\.txt|hail_batch_pipeline/docker/|\.github/workflows/build_docker_image\.yml)'; then
            echo "Image-relevant changes found: building."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No image-relevant changes: skipping build."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build and push
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest

    steps:
      # Full history so the job can switch to main after building in order to commit the digest.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to Docker Hub
        id: push
        run: |
          set -euo pipefail
          # Reuse the Dockerfile and tag defined in the Makefile rather than duplicating them here. The
          # Makefile's build target sets the build context to the repo root, which is where the Dockerfile
          # expects to find utils/, perfect_repeat_finder.py and requirements.txt.
          make -C hail_batch_pipeline/docker build
          TAG=$(grep -E '^TAG' hail_batch_pipeline/docker/Makefile | cut -d'=' -f2 | xargs)
          docker push "$TAG" | tee push.log
          # sha256.txt holds the bare digest (no image name), which is the format already in the repo.
          # `|| true` so an unparseable push log reaches the explicit check below with a clear message,
          # instead of `set -e` killing the step on grep's exit status.
          DIGEST=$(grep -E 'latest: digest: sha256:' push.log | sed -E 's/.*(sha256:[0-9a-f]+).*/\1/' || true)
          if [ -z "$DIGEST" ]; then
            echo "Could not parse a digest out of the push output."
            exit 1
          fi
          echo "image=${TAG%:latest}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${TAG%:latest}@${DIGEST}"

      - name: Commit the updated digest
        env:
          IMAGE: ${{ steps.push.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          # The build ran against a detached head_sha checkout; move to main to commit.
          git fetch origin main
          git checkout -B main origin/main

          echo "$DIGEST" > "${GITHUB_WORKSPACE}/hail_batch_pipeline/docker/sha256.txt"
          # Keep the pipeline's pinned image in step with what was just published. Without this the
          # DOCKER_IMAGE constant silently drifts behind the image the Dockerfile builds.
          sed -i -E "s|^DOCKER_IMAGE = \".*\"|DOCKER_IMAGE = \"${IMAGE}\"|" \
            "${GITHUB_WORKSPACE}/hail_batch_pipeline/run_hail_batch_pipeline.py"
          grep -n '^DOCKER_IMAGE' "${GITHUB_WORKSPACE}/hail_batch_pipeline/run_hail_batch_pipeline.py"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hail_batch_pipeline/docker/sha256.txt hail_batch_pipeline/run_hail_batch_pipeline.py
          if git diff --cached --quiet; then
            echo "No digest change to commit"
            exit 0
          fi
          git commit -m "Update docker image sha256 digest [skip ci]"
          # Another commit may land on main during the multi-minute build, making a bare push a
          # non-fast-forward. Try to push; on failure, rebase our commit onto the latest main -- taking
          # our freshly-built digest on conflict (-X theirs) -- and retry. Always abort any half-finished
          # rebase first, so a prior conflict can't leave unmerged files and wedge every later attempt.
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "Push attempt ${attempt} failed; rebasing onto latest main and retrying."
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase -X theirs origin/main || git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Failed to push the updated digest after multiple attempts."
          exit 1
